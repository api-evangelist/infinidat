  conforms: false
  evidence: >-
    Infinidat publishes no OpenAPI or Swagger document. openapi/infinidat-infinibox-openapi.yml is
    an API Evangelist derivation from Infinidat's own 7.3 Postman collection, not a provider artifact.
- id: postman-collection-v2
