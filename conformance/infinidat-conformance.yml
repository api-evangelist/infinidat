summary: >-
  The InfiniBox management API is a proprietary REST surface: JSON over HTTPS with a consistent
  result/metadata/error envelope, but no adoption of the cross-cutting web-API standards
  (OAuth 2.0, OIDC, RFC 9457, JSON:API, OData, SCIM). Where Infinidat does conform to industry
  standards, it is in the storage and infrastructure ecosystem - CSI, OpenStack Cinder, SMI-like
  storage integrations, FIPS-validated cryptography - not in the API-design ecosystem.
standards:
