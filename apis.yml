apis:
- aid: infinidat:infinibox-rest-api
  name: InfiniBox REST API (InfiniAPI)
  description: 'The management REST API served by every InfiniBox and InfiniBox SSA array on its own
    management interface at https://<array>/api/rest. It exposes system health and readiness, capacity
    and statistics, hardware components (racks, nodes, ports, drives, support appliances), pools,
    filesystems, hosts, entity metadata, LDAP/Active Directory user repositories, KMS and certificate
    configuration, and session login/logout. Responses use a consistent envelope of result / metadata /
    error, with page + page_size pagination, a fields selector, sort, and eq:/ne:/like: filter
    operators. High-consequence operations are gated behind an explicit ?approved=true re-issue.
    Because the API is served by the appliance itself there is no single public base URL — the server
    is a template over the customer''s own array hostname.'
  humanURL: https://support.infinidat.com/hc/en-us/categories/10106041231901-Documentation
  baseURL: https://{infinibox_host}/api/rest
  tags:
