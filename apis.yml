aid: infinidat
name: Infinidat
description: 'Infinidat is an enterprise storage vendor — a Lenovo company since April 2026 — building
  petabyte-scale primary storage, all-flash arrays and cyber-resilient backup appliances: InfiniBox and
  InfiniBox SSA for primary block and file workloads, InfiniGuard for backup and rapid recovery, and the
  InfiniSafe cyber-resilience layer with immutable snapshots, logical air-gapping, a fenced forensic
  environment and cyber detection. Every InfiniBox array serves its own management REST API (InfiniAPI)
  at https://<array>/api/rest, alongside the InfiniShell CLI and an HTML5 GUI. Infinidat publishes a
  first-party Postman collection for the InfiniBox 7.3 API, the InfiniSDK Python SDK, an Ansible
  collection, a Kubernetes CSI driver and an OpenStack Cinder driver on GitHub.'
