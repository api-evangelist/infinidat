notes: >-
  Infinidat does not publish an open error-code registry for the InfiniBox REST API - the full
  code list ships inside the product documentation on support.infinidat.com, which is
  authentication-walled. The codes below are the ones that are genuinely observable in public
  first-party sources (InfiniSDK's own handling of them). HTTP statuses are those InfiniSDK's
  transport layer branches on. Nothing here is invented; the catalog is deliberately short
  rather than padded.
status_codes:
- status: 200
  meaning: Success. result carries the object or collection, error is null.
  evidence: saved 200 examples in postman/infinidat-infinibox-7-3-postman.json
- status: 401
  meaning: >-
    Unauthenticated - no session, or the session cookie expired. InfiniSDK marks the client
    logged-out, calls system.login() and retries the request exactly once.
  evidence: 'infinisdk/core/api/api.py: requests.codes.unauthorized branch in APITarget.request'
  remediation: Re-authenticate with POST /users/login and retry.
- status: 403
  meaning: >-
    Forbidden. When error.code is REMOTE_PERMISSION_REQUIRED the operation targets a related
    (replication peer) InfiniBox and needs that system's credentials.
  evidence: 'infinisdk/core/api/api.py: (e.status_code == 403) and (e.error_code == "REMOTE_PERMISSION_REQUIRED")'
  remediation: Retry with an X-Remote-Authorization Basic credential for the related system.
- status: 503
  meaning: Service unavailable - the array is not currently able to serve the management API.
  evidence: 'infinisdk/core/api/api.py: httplib.SERVICE_UNAVAILABLE handling in the auto-retry context'
  remediation: Retry; InfiniSDK's auto-retry context handles this transparently.
error_codes:
- code: APPROVAL_REQUIRED
  title: Operation requires explicit approval
  meaning: >-
    A high-consequence operation was rejected because it was not explicitly approved. The reason
    is on error.reasons[0].
  action: Re-issue the identical request with the query parameter approved=true.
  evidence: 'infinisdk/core/config.py: infinibox.approval_required_codes'
- code: APPROVAL_REQUIRED_VOLUME_HAS_CHILDREN
  title: Operation requires approval - volume has children
  meaning: >-
    The targeted volume has dependent snapshots or clones, so the operation is gated behind
    explicit approval.
  action: Confirm the blast radius, then re-issue with approved=true.
  evidence: 'infinisdk/core/config.py: infinibox.approval_required_codes'
- code: REMOTE_PERMISSION_REQUIRED
  title: Credentials required for the related system
  meaning: >-
    The operation crosses into a replication peer InfiniBox for which no credentials were supplied.
  action: Supply the peer's credentials on the X-Remote-Authorization header (Basic) and retry.
  evidence: 'infinisdk/core/api/api.py'
