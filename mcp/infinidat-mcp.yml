excluded_from_candidate_set:
  reason: Operations that change identity, encryption or trust configuration are deliberately left out
    of the candidate agent surface. An agent that can rewrite the KMS configuration, upload the array's
    TLS key, or reorder the LDAP repositories can lock every administrator out of the array or make encrypted
    data unreadable.
  operations:
  - configKMSSet
  - configKMSUploadCACertificate
  - configKMSUploadCertificateAndKey
  - certificateUploadCsr
  - ldapCreateAUserRepository
  - ldapUpdateTheRepositoryAttributes
  - ldapReorder
  - ldapReload
agent_notes:
  approval_gate: Any tool that mutates state must be prepared for an APPROVAL_REQUIRED / APPROVAL_REQUIRED_VOLUME_HAS_CHILDREN
    error, surface error.reasons[0] to a human, and only then retry with ?approved=true.
  idempotency: There is no idempotency key. A retried mutating call may duplicate its effect.
