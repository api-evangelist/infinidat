notes: >-
  First-party Infinidat client libraries, automation collections and drivers found on public
  registries. Infinidat publishes almost exclusively in the Python / Go / Ansible ecosystems -
  there is no first-party JavaScript, Java, .NET, Ruby, PHP or Rust SDK for the InfiniBox API.
  The infi.* namespace on PyPI is Infinidat's own low-level systems-programming toolkit and is
  listed here only where it is a direct dependency of InfiniSDK.
